AWSTemplateFormatVersion: "2010-09-09"
Description: >
  MSK Connectのカスタムプラグイン(Debezium PostgreSQL Connector / Snowflake Kafka Connector)を
  置くS3バケット。プラグインZIPのアップロードはCLIで行うため、先にこのスタックだけ単独でデプロイする。

Parameters:
  ProjectName:
    Type: String
    Default: pg-cdc

  BucketName:
    Type: String
    Description: "グローバルに一意なバケット名(例: pg-cdc-connect-plugins-123456789012)"

Resources:
  PluginBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  PluginBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PluginBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowMskConnectRead
            Effect: Allow
            Principal:
              Service: kafkaconnect.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${PluginBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

Outputs:
  BucketName:
    Value: !Ref PluginBucket
    Export:
      Name: !Sub "${ProjectName}-PluginBucketName"
  BucketArn:
    Value: !GetAtt PluginBucket.Arn
    Export:
      Name: !Sub "${ProjectName}-PluginBucketArn"
