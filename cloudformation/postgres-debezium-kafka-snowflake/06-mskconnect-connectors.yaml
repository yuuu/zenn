AWSTemplateFormatVersion: "2010-09-09"
Description: >
  MSK Connect: Debezium PostgreSQL Source Connector / Snowflake Sink Connector。
  事前に以下をCLIで作成し、ARNをパラメータへ渡すこと。
    - Secrets Manager: DebeziumがRDSへ接続するためのDBパスワード
    - Secrets Manager: Snowflake Kafka ConnectorのRSA秘密鍵(PKCS8, 平文)
  (鍵・パスワードそのものをテンプレートに書かないため、あえてCFN管理外にしている)

Parameters:
  ProjectName:
    Type: String
    Default: pg-cdc

  KafkaConnectVersion:
    Type: String
    Default: "2.7.1"

  McuCount:
    Type: Number
    Default: 1

  WorkerCount:
    Type: Number
    Default: 1

  # --- Debezium PostgreSQL Source Connector ---
  DebeziumDbHost:
    Type: String
    Description: "RDSエンドポイント(02-rds.yamlのDBInstanceEndpointAddress)"

  DebeziumDbPort:
    Type: String
    Default: "5432"

  DebeziumDbName:
    Type: String
    Default: appdb

  DebeziumDbUsername:
    Type: String
    Default: debezium

  DebeziumDbSecretArn:
    Type: String
    Description: "debeziumユーザーのパスワードを持つSecrets ManagerシークレットのARN(json key: password)"

  DebeziumTopicPrefix:
    Type: String
    Default: pgdb

  DebeziumTableIncludeList:
    Type: String
    Default: public.orders

  DebeziumPublicationName:
    Type: String
    Default: dbz_publication

  DebeziumSlotName:
    Type: String
    Default: dbz_pgdb_slot

  # --- Snowflake Sink Connector ---
  SnowflakeAccountUrl:
    Type: String
    Description: "例: https://xxxxxxx-xxxxxxx.snowflakecomputing.com"

  SnowflakeUser:
    Type: String
    Default: PG_CDC_KAFKA_USER

  SnowflakeRole:
    Type: String
    Default: PG_CDC_KAFKA_ROLE

  SnowflakeDatabase:
    Type: String
    Default: PG_CDC_DB

  SnowflakeSchema:
    Type: String
    Default: RAW

  SnowflakeTopic2TableMap:
    Type: String
    Default: "pgdb.public.orders:ORDERS_CDC_RAW"

  SnowflakePrivateKeySecretArn:
    Type: String
    Description: "Snowflake Kafka Connector用RSA秘密鍵を持つSecrets ManagerシークレットのARN(json key: private_key)"

Resources:
  ConnectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/msk-connect/${ProjectName}"
      RetentionInDays: 14

  ConnectExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-mskconnect-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: kafkaconnect.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: msk-connect-execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: KafkaCluster
                Effect: Allow
                Action:
                  - kafka-cluster:Connect
                  - kafka-cluster:DescribeCluster
                  - kafka-cluster:AlterCluster
                  - kafka-cluster:DescribeClusterDynamicConfiguration
                  - kafka-cluster:CreateTopic
                  - kafka-cluster:DescribeTopic
                  - kafka-cluster:AlterTopic
                  - kafka-cluster:DescribeTopicDynamicConfiguration
                  - kafka-cluster:ReadData
                  - kafka-cluster:WriteData
                  - kafka-cluster:AlterGroup
                  - kafka-cluster:DescribeGroup
                Resource: "*"
              - Sid: NetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:CreateNetworkInterfacePermission
                Resource: "*"
              - Sid: Secrets
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref DebeziumDbSecretArn
                  - !Ref SnowflakePrivateKeySecretArn
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:CreateLogGroup
                Resource: !GetAtt ConnectLogGroup.Arn

  DebeziumPostgresSourceConnector:
    Type: AWS::KafkaConnect::Connector
    Properties:
      ConnectorName: !Sub "${ProjectName}-debezium-postgres-source"
      ConnectorDescription: "RDS for PostgreSQL -> Kafka(CDC)"
      KafkaConnectVersion: !Ref KafkaConnectVersion
      Capacity:
        ProvisionedCapacity:
          McuCount: !Ref McuCount
          WorkerCount: !Ref WorkerCount
      ConnectorConfiguration:
        connector.class: io.debezium.connector.postgresql.PostgresConnector
        tasks.max: "1"
        database.hostname: !Ref DebeziumDbHost
        database.port: !Ref DebeziumDbPort
        database.user: !Ref DebeziumDbUsername
        database.password: !Join ["", ["${secretsManager:", !Ref DebeziumDbSecretArn, ":password}"]]
        database.dbname: !Ref DebeziumDbName
        topic.prefix: !Ref DebeziumTopicPrefix
        table.include.list: !Ref DebeziumTableIncludeList
        plugin.name: pgoutput
        publication.name: !Ref DebeziumPublicationName
        publication.autocreate.mode: disabled
        slot.name: !Ref DebeziumSlotName
        snapshot.mode: initial
        key.converter: org.apache.kafka.connect.json.JsonConverter
        key.converter.schemas.enable: "false"
        value.converter: org.apache.kafka.connect.json.JsonConverter
        value.converter.schemas.enable: "true"
        heartbeat.interval.ms: "10000"
      KafkaCluster:
        ApacheKafkaCluster:
          BootstrapServers:
            Fn::ImportValue: !Sub "${ProjectName}-MskBootstrapSaslIam"
          Vpc:
            SecurityGroups:
              - Fn::ImportValue: !Sub "${ProjectName}-MskConnectSecurityGroupId"
            Subnets:
              - Fn::ImportValue: !Sub "${ProjectName}-PrivateSubnet0Id"
              - Fn::ImportValue: !Sub "${ProjectName}-PrivateSubnet1Id"
              - Fn::ImportValue: !Sub "${ProjectName}-PrivateSubnet2Id"
      KafkaClusterClientAuthentication:
        AuthenticationType: IAM
      KafkaClusterEncryptionInTransit:
        EncryptionType: TLS
      Plugins:
        - CustomPlugin:
            CustomPluginArn:
              Fn::ImportValue: !Sub "${ProjectName}-DebeziumPluginArn"
            Revision:
              Fn::ImportValue: !Sub "${ProjectName}-DebeziumPluginRevision"
      ServiceExecutionRoleArn: !GetAtt ConnectExecutionRole.Arn
      LogDelivery:
        WorkerLogDelivery:
          CloudWatchLogs:
            Enabled: true
            LogGroup: !Ref ConnectLogGroup

  SnowflakeSinkConnector:
    Type: AWS::KafkaConnect::Connector
    Properties:
      ConnectorName: !Sub "${ProjectName}-snowflake-sink"
      ConnectorDescription: "Kafka(CDC) -> Snowflake(Snowpipe Streaming)"
      KafkaConnectVersion: !Ref KafkaConnectVersion
      Capacity:
        ProvisionedCapacity:
          McuCount: !Ref McuCount
          WorkerCount: !Ref WorkerCount
      ConnectorConfiguration:
        connector.class: com.snowflake.kafka.connector.SnowflakeSinkConnector
        tasks.max: "1"
        topics: !Sub "${DebeziumTopicPrefix}.${DebeziumTableIncludeList}"
        snowflake.topic2table.map: !Ref SnowflakeTopic2TableMap
        snowflake.url.name: !Ref SnowflakeAccountUrl
        snowflake.user.name: !Ref SnowflakeUser
        snowflake.private.key: !Join ["", ["${secretsManager:", !Ref SnowflakePrivateKeySecretArn, ":private_key}"]]
        snowflake.role.name: !Ref SnowflakeRole
        snowflake.database.name: !Ref SnowflakeDatabase
        snowflake.schema.name: !Ref SnowflakeSchema
        snowflake.ingestion.method: SNOWPIPE_STREAMING
        snowflake.enable.schematization: "false"
        snowflake.streaming.max.client.lag: "1"
        key.converter: org.apache.kafka.connect.storage.StringConverter
        value.converter: org.apache.kafka.connect.json.JsonConverter
        value.converter.schemas.enable: "true"
      KafkaCluster:
        ApacheKafkaCluster:
          BootstrapServers:
            Fn::ImportValue: !Sub "${ProjectName}-MskBootstrapSaslIam"
          Vpc:
            SecurityGroups:
              - Fn::ImportValue: !Sub "${ProjectName}-MskConnectSecurityGroupId"
            Subnets:
              - Fn::ImportValue: !Sub "${ProjectName}-PrivateSubnet0Id"
              - Fn::ImportValue: !Sub "${ProjectName}-PrivateSubnet1Id"
              - Fn::ImportValue: !Sub "${ProjectName}-PrivateSubnet2Id"
      KafkaClusterClientAuthentication:
        AuthenticationType: IAM
      KafkaClusterEncryptionInTransit:
        EncryptionType: TLS
      Plugins:
        - CustomPlugin:
            CustomPluginArn:
              Fn::ImportValue: !Sub "${ProjectName}-SnowflakePluginArn"
            Revision:
              Fn::ImportValue: !Sub "${ProjectName}-SnowflakePluginRevision"
      ServiceExecutionRoleArn: !GetAtt ConnectExecutionRole.Arn
      LogDelivery:
        WorkerLogDelivery:
          CloudWatchLogs:
            Enabled: true
            LogGroup: !Ref ConnectLogGroup

Outputs:
  DebeziumConnectorArn:
    Value: !Ref DebeziumPostgresSourceConnector
  SnowflakeConnectorArn:
    Value: !Ref SnowflakeSinkConnector
